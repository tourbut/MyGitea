name: mygitea

services:
  gitea:
    image: gitea/gitea:28.4
    container_name: gitea
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__server__DOMAIN: gitea.knowslog.com
      GITEA__server__ROOT_URL: https://gitea.knowslog.com/
      GITEA__server__HTTP_PORT: "3000"
      # SSH is not routed through the Cloudflare tunnel; clone over HTTPS.
      GITEA__server__DISABLE_SSH: "true"
      GITEA__database__DB_TYPE: sqlite3
      # Lock the web installer: the site is public as soon as the tunnel is up.
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "false"
    volumes:
      - gitea-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      # Localhost only; public access goes through cloudflared.
      - "127.0.0.1:3030:3000"

  runner:
    image: gitea/act_runner:0.6.1
    container_name: gitea-runner
    restart: unless-stopped
    depends_on:
      - gitea
    environment:
      CONFIG_FILE: /config.yaml
      GITEA_INSTANCE_URL: http://gitea:3000
      # Only read on first start; registration is then kept in /data/.runner.
      GITEA_RUNNER_REGISTRATION_TOKEN: ${RUNNER_REGISTRATION_TOKEN:-}
      GITEA_RUNNER_NAME: knowslog-runner
    volumes:
      - ./runner-config.yaml:/config.yaml:ro
      - runner-data:/data
      # Job containers run on the host Docker daemon (root-equivalent access).
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  gitea-data:
  runner-data:
