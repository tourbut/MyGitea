# act_runner config. Unlisted keys use act_runner defaults (`act_runner generate-config`).
log:
  level: info

runner:
  file: /data/.runner
  capacity: 1
  timeout: 3h
  labels:
    - "ubuntu-latest:docker://docker.gitea.com/runner-images:ubuntu-latest"
    - "ubuntu-24.04:docker://docker.gitea.com/runner-images:ubuntu-24.04"

cache:
  enabled: true
  dir: /data/cache
  # Job containers join the compose network, so they reach the cache by container name.
  host: gitea-runner
  port: 8088

container:
  network: mygitea_default
